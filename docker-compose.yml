# Dev: Postgres/Redis dùng container sẵn có trên máy (postgres_db, docker-redis-1) → chỉ cần Typesense:
#   docker compose up -d
# Máy khác / CI (chưa có postgres, redis): docker compose --profile standalone up -d
name: search-app

services:
  typesense:
    image: typesense/typesense:30.1
    command: ["--data-dir=/data", "--api-key=${TYPESENSE_API_KEY:-dev-typesense-key}", "--enable-cors"]
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8108' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    profiles: ["standalone"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: search_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    profiles: ["standalone"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  typesense_data:
  postgres_data:
