# Typesense HA cluster 3 node (task 6.2) — self-host. Raft: chịu được mất 1 node (quorum 2/3).
#   docker compose -f deploy/typesense-ha/docker-compose.yml up -d
#   TYPESENSE_NODES=http://localhost:8211,http://localhost:8212,http://localhost:8213
# Production: mỗi node một máy/AZ riêng, ≥ 8 vCPU (đo ở docs/ops/load-and-ha.md), đĩa SSD, snapshot hằng đêm.
x-node: &node
  image: typesense/typesense:30.1
  restart: unless-stopped
  environment:
    TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-key}
  volumes:
    - ./nodes:/config/nodes:ro

services:
  ts1:
    <<: *node
    command: ["--data-dir=/data", "--nodes=/config/nodes", "--peering-address=172.28.0.11", "--api-port=8108", "--peering-port=8107", "--enable-cors"]
    ports: ["8211:8108"]
    volumes: [ts1:/data, ./nodes:/config/nodes:ro]
    networks: { ts: { ipv4_address: 172.28.0.11 } }
  ts2:
    <<: *node
    command: ["--data-dir=/data", "--nodes=/config/nodes", "--peering-address=172.28.0.12", "--api-port=8108", "--peering-port=8107", "--enable-cors"]
    ports: ["8212:8108"]
    volumes: [ts2:/data, ./nodes:/config/nodes:ro]
    networks: { ts: { ipv4_address: 172.28.0.12 } }
  ts3:
    <<: *node
    command: ["--data-dir=/data", "--nodes=/config/nodes", "--peering-address=172.28.0.13", "--api-port=8108", "--peering-port=8107", "--enable-cors"]
    ports: ["8213:8108"]
    volumes: [ts3:/data, ./nodes:/config/nodes:ro]
    networks: { ts: { ipv4_address: 172.28.0.13 } }

networks:
  ts:
    ipam:
      config: [{ subnet: 172.28.0.0/24 }]

volumes:
  ts1:
  ts2:
  ts3:
