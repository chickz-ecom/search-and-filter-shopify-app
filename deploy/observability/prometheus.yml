# Prometheus scrape config (task 6.1). Token = METRICS_TOKEN (same value on search-api and worker).
global:
  scrape_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: search-api
    metrics_path: /metrics
    authorization: { credentials_file: /etc/prometheus/metrics_token }
    static_configs:
      - targets: ["search-api:8787"]
  - job_name: worker
    metrics_path: /metrics
    authorization: { credentials_file: /etc/prometheus/metrics_token }
    static_configs:
      - targets: ["worker:9464"]
