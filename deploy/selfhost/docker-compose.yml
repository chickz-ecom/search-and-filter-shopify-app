# Self-host một máy (task 6.4): admin, search-api, worker từ cùng image + Postgres, Redis, Typesense.
# Production nhiều máy: Typesense theo deploy/typesense-ha, Postgres/Redis managed (docs/ops/deploy.md).
#   docker build -t searchapp:latest . && cp .env.example deploy/selfhost/.env  (điền giá trị thật)
#   docker compose -f deploy/selfhost/docker-compose.yml --env-file deploy/selfhost/.env up -d
x-app: &app
  image: ${SEARCHAPP_IMAGE:-searchapp:latest}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://searchapp:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/searchapp
    REDIS_URL: redis://redis:6379
    TYPESENSE_HOST: typesense
    TYPESENSE_PORT: "8108"
    TYPESENSE_PROTOCOL: http
  depends_on: [postgres, redis, typesense]

services:
  admin:
    <<: *app
    ports: ["3000:3000"]
  search-api:
    <<: *app
    command: ["npm", "run", "start:search-api"]
    ports: ["8787:8787"]
  worker:
    <<: *app
    command: ["npm", "run", "start:worker"]
    deploy: { replicas: 2 }
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: searchapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: searchapp
    volumes: [pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF + noeviction: queue BullMQ không mất job, không bị xoá khi đầy bộ nhớ.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
  typesense:
    image: typesense/typesense:30.1
    restart: unless-stopped
    command: ["--data-dir=/data", "--api-key=${TYPESENSE_API_KEY:?set TYPESENSE_API_KEY}"]
    volumes: [typesense:/data]

volumes:
  pg:
  redis:
  typesense:
