# Render Blueprint (task 6.4): admin + search-api + worker từ cùng image, Postgres và Redis (Key Value) managed.
# VERIFY: tên field/plan theo docs Render Blueprint hiện hành (HUMAN_TODO M1) — đặc biệt `type: keyvalue`
# (trước đây `redis`) và `maxmemoryPolicy`. Typesense: Typesense Cloud HA (docs/ops/load-and-ha.md).
services:
  - type: web
    name: searchapp-admin
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    numInstances: 2
    healthCheckPath: /
    envVars:
      - fromGroup: searchapp-shared
      - key: DATABASE_URL
        fromDatabase: { name: searchapp-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: searchapp-redis, property: connectionString }

  - type: web
    name: searchapp-search-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:search-api
    plan: standard
    numInstances: 2
    healthCheckPath: /health
    envVars:
      - fromGroup: searchapp-shared
      - key: SEARCH_API_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase: { name: searchapp-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: searchapp-redis, property: connectionString }

  - type: worker
    name: searchapp-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:worker
    plan: standard
    numInstances: 2
    envVars:
      - fromGroup: searchapp-shared
      - key: DATABASE_URL
        fromDatabase: { name: searchapp-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: searchapp-redis, property: connectionString }

  - type: keyvalue
    name: searchapp-redis
    plan: standard
    # BullMQ cần noeviction: Redis không được tự xoá key của queue khi đầy bộ nhớ.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: searchapp-db
    plan: basic-4gb
    postgresMajorVersion: "16"

envVarGroups:
  - name: searchapp-shared
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: SHOPIFY_API_KEY, sync: false }
      - { key: SHOPIFY_API_SECRET, sync: false }
      - { key: SHOPIFY_APP_URL, sync: false }
      - { key: SCOPES, sync: false }
      - { key: SEARCH_API_PUBLIC_URL, sync: false }
      - { key: INTERNAL_API_SECRET, generateValue: true }
      - { key: METRICS_TOKEN, generateValue: true }
      - { key: TYPESENSE_NODES, sync: false }
      - { key: TYPESENSE_PROTOCOL, value: https }
      - { key: TYPESENSE_API_KEY, sync: false }
      - { key: TYPESENSE_SEARCH_ONLY_KEY, sync: false }
      - { key: SHOPIFY_APP_GID, sync: false }
      - { key: SHOPIFY_PARTNER_ORG_ID, sync: false }
      - { key: SHOPIFY_PARTNER_API_TOKEN, sync: false }
      - { key: DEVELOPER_DOCS_URL, sync: false }
      - { key: CDN_PURGE_URL, sync: false }
      - { key: CDN_PURGE_TOKEN, sync: false }
