query BulkInnerProducts {
  products(query: "status:active AND published_status:published") {
    edges {
      node {
        id
        handle
        title
        vendor
        productType
        tags
        status
        description
        descriptionHtml
        createdAt
        publishedAt
        updatedAt
        onlineStoreUrl
        totalInventory
        tracksInventory
        hasOnlyDefaultVariant
        hasOutOfStockVariants
        isGiftCard
        templateSuffix
        variantsCount {
          count
        }
        category {
          id
          fullName
        }
        seo {
          title
          description
        }
        featuredMedia {
          id
          mediaContentType
          alt
          preview {
            image {
              url
              altText
              width
              height
            }
          }
        }
        options {
          id
          name
          position
          values
          optionValues {
            id
            name
            swatch {
              color
            }
          }
        }
        priceRangeV2 {
          minVariantPrice {
            amount
            currencyCode
          }
          maxVariantPrice {
            amount
            currencyCode
          }
        }
        compareAtPriceRange {
          minVariantCompareAtPrice {
            amount
            currencyCode
          }
          maxVariantCompareAtPrice {
            amount
            currencyCode
          }
        }
        mf_0: metafield(namespace: "custom", key: "material") {
          value
          type
        }
        mf_1: metafield(namespace: "custom", key: "color") {
          value
          type
        }
      }
    }
  }
}
