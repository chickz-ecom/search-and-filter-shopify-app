query BulkOrders {
  orders(query: "created_at:>='2026-08-27' AND test:false") {
    edges {
      node {
        id
        createdAt
        cancelledAt
        test
        lineItems {
          edges {
            node {
              id
              currentQuantity
              product { id }
              discountedTotalSet { shopMoney { amount currencyCode } }
            }
          }
        }
      }
    }
  }
}
