name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: search_app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      typesense:
        image: typesense/typesense:30.1
        env:
          TYPESENSE_DATA_DIR: /tmp
          TYPESENSE_API_KEY: dev-typesense-key
        ports: ["8108:8108"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx dotenv -e .env.test -- prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Bundle storefront trước test: contract test của theme extension kiểm tra asset tồn tại; vượt ngân sách gzip → fail.
      - run: npm run build:storefront
      # docs/developers/sdk-reference.md sinh từ .d.ts — fail nếu quên `npm run docs:sdk`
      - run: node scripts/gen-sdk-docs.mjs --check
      # Theme Check (không cần đăng nhập): extension + 3 section mẫu cho developer (task 4.2)
      - run: npx -y -p @shopify/cli@4 shopify theme check --path extensions/search-theme --fail-level error
      - run: |
          mkdir -p /tmp/tc/sections /tmp/tc/layout /tmp/tc/locales /tmp/tc/config
          cp docs/developers/examples/*.liquid /tmp/tc/sections/
          printf '<!doctype html><html><head>{{ content_for_header }}</head><body>{{ content_for_layout }}</body></html>' > /tmp/tc/layout/theme.liquid
          echo '{}' > /tmp/tc/locales/en.default.json && echo '[]' > /tmp/tc/config/settings_schema.json
          npx -y -p @shopify/cli@4 shopify theme check --path /tmp/tc --fail-level error
      - run: npm test
        env:
          CI: "true"

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Lighthouse mobile: theme fixture có / không có app (Home 17% · Product 40% · Collection 43%), giảm > 5 điểm → fail.
      - run: npm run lighthouse:compare

      - run: npm run build

  shopify-config:
    runs-on: ubuntu-latest
    # Cần secret SHOPIFY_CLI_PARTNERS_TOKEN (xem docs/HUMAN_TODO.md)
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx -y -p @shopify/cli@4 shopify app config validate --no-input
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
